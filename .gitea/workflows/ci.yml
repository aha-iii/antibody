# Gitea Actions 工作流（Gitea 不读 .github/workflows，故单独一份）
#
# 仓库已自包含：原先指向同级 Nerve-waf 的 5 处 path 依赖，已改为
# crates/external/ 下的源码副本（见 crates/external/README.md），
# 因此不再需要 checkout 第二个仓库。

name: ci

on:
  push:
    branches: [main, master, "develop/*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: secrets + fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 密钥目录不得被跟踪
        run: |
          if git ls-files | grep -E '^\.secrets/'; then
            echo "::error::.secrets/ 不应入库；包封装密钥只存在于密钥库或部署环境"
            exit 1
          fi
          echo "no tracked key material"

      - name: 历史中不得出现密钥目录
        run: |
          leaks=$(git rev-list --all | while read -r r; do
            git ls-tree -r --name-only "$r"
          done | grep -E '^\.secrets/' | sort -u || true)
          if [ -n "$leaks" ]; then
            echo "::error::Git 历史中仍存在密钥路径："
            echo "$leaks"
            exit 1
          fi
          echo "history clean"

      - name: Toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude nerve-antibody-dashboard

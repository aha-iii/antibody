# GitHub Actions 工作流（开源仓库用；内网 Gitea 见 .gitea/workflows/ci.yml）
#
# 仓库已自包含：原先指向同级 Nerve-waf 的 5 处 path 依赖，已改为
# crates/external/ 下的源码副本（见 crates/external/README.md），
# 因此不再需要 checkout 第二个仓库。

name: ci

on:
  push:
    branches: [main, master, "develop/*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 密钥目录不得被跟踪
        run: |
          if git ls-files | grep -E '^\.secrets/'; then
            echo "::error::.secrets/ 不应入库；包封装密钥只存在于密钥库或部署环境"
            exit 1
          fi
          echo "no tracked key material"

      - name: 历史中不得出现密钥目录
        run: |
          leaks=$(git rev-list --all | while read -r r; do
            git ls-tree -r --name-only "$r"
          done | grep -E '^\.secrets/' | sort -u || true)
          if [ -n "$leaks" ]; then
            echo "::error::Git 历史中仍存在密钥路径："
            echo "$leaks"
            exit 1
          fi
          echo "history clean"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Engine facade
        run: cargo test -p nerve-antibody-engine --lib
      - name: Pipeline and runtime
        run: cargo test -p nerve-antibody-pipeline -p nerve-antibody-runtime
      - name: Contracts (dsl / pack / signals / semantic)
        run: cargo test -p nerve-antibody-dsl -p nerve-antibody-pack -p nerve-antibody-signals -p nerve-antibody-semantic

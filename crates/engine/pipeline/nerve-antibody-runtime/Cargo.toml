[package]
name = "nerve-antibody-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Evaluate compiled expert Program (score + observe + semantic + adaptive)"

[features]
default = []
inspect-trace = ["dep:nerve-inspect-trace"]
# 并行深检（tail.rs / parallel.rs 中的 parallel-deep 分支）。默认关闭，仅显式开启时编译。
parallel-deep = []

[dependencies]
nerve-antibody-metrics = { workspace = true }
nerve-antibody-pipeline = { workspace = true }
nerve-antibody-compiler = { workspace = true }
nerve-antibody-dsl = { workspace = true }
nerve-antibody-adaptive = { workspace = true }
nerve-antibody-semantic = { workspace = true }
nerve-antibody-signals = { workspace = true }
nerve-antibody-accel = { workspace = true, optional = true }
nerve-inspect-trace = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
nerve-antibody-compiler = { workspace = true }
nerve-antibody-dsl = { workspace = true }

[package]
name = "nerve-antibody-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "HTTP adapter for blazehttp / WAF interception benchmarks against Antibody Engine"
publish = false

[[bin]]
name = "nerve-antibody-bench"
path = "src/main.rs"

[[bin]]
name = "nerve-antibody-samples-regress"
path = "src/bin/nerve-antibody-samples-regress.rs"

[[bin]]
name = "nerve-antibody-calibrate-route"
path = "src/bin/nerve-antibody-calibrate-route.rs"

[dependencies]
nerve-antibody-engine = { workspace = true }
nerve-antibody-runtime = { workspace = true }
nerve-antibody-metrics = { workspace = true }
nerve-antibody-accel = { workspace = true }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
http-body-util = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

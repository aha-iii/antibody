[package]
name = "nerve-antibody"
description = "WAF integration facade for Arc-Cortex Engine (re-exports nerve-antibody-engine)"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
authors.workspace = true

[features]
default = []
inspect-trace = [
    "nerve-antibody-engine/inspect-trace",
    "nerve-antibody-runtime/inspect-trace",
]
accel-hyperscan = ["nerve-antibody-engine/accel-hyperscan"]
accel-hyperscan-ffi = ["nerve-antibody-engine/accel-hyperscan-ffi"]

[dependencies]
nerve-antibody-engine = { workspace = true }
nerve-antibody-runtime = { workspace = true }
nerve-antibody-dsl = { workspace = true }
nerve-antibody-license = { workspace = true }
nerve-antibody-metrics = { workspace = true }

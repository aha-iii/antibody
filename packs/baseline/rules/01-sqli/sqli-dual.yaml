id: sqli-dual
name: 'SQL FROM DUAL'
severity: high
tags: [sqli, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      regex: "(?i)\\bfrom\\s+dual\\b"
    - field: query
      regex: "(?i)\\bfrom\\s+dual\\b"
    - field: body
      regex: "(?i)\\bfrom\\s+dual\\b"

id: sqli-into-dumpfile
name: 'SQL INTO DUMPFILE'
severity: high
tags: [sqli, owasp]
score: 45
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri

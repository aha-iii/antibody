id: xss-body-on
name: 'XSS body event'
severity: high
tags: [xss, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, html_numeric_decode, html_entity_decode, js_unescape, lowercase]
when:
  any:
    - field: uri
      regex: "(?i)<body[^>]+on\\w+\\s*="
    - field: query
      regex: "(?i)<body[^>]+on\\w+\\s*="
    - field: body
      regex: "(?i)<body[^>]+on\\w+\\s*="

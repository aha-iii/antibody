id: xss-document-cookie
name: 'XSS document.cookie'
severity: high
tags: [xss, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, html_numeric_decode, html_entity_decode, js_unescape, lowercase]
when:
  any:
    - field: uri
      contains: 'document.cookie'
    - field: query
      contains: 'document.cookie'
    - field: body
      contains: 'document.cookie'

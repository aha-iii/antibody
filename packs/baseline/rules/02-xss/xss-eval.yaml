id: xss-eval
name: 'XSS eval call'
severity: high
tags: [xss, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, html_numeric_decode, html_entity_decode, js_unescape, lowercase]
when:
  any:
    - field: uri
      regex: "(?i)\\beval\\s*\\("
    - field: query
      regex: "(?i)\\beval\\s*\\("
    - field: body
      regex: "(?i)\\beval\\s*\\("

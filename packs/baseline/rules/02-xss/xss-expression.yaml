id: xss-expression
name: 'XSS CSS expression'
severity: high
tags: [xss, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, html_numeric_decode, html_entity_decode, js_unescape, lowercase]
when:
  any:
    - field: uri
      contains: 'expression('
    - field: uri
      contains: 'expression ('
    - field: query
      contains: 'expression('
    - field: query
      contains: 'expression ('
    - field: body
      contains: 'expression('
    - field: body
      contains: 'expression ('

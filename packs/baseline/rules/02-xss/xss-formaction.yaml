id: xss-formaction
name: 'XSS formaction'
severity: high
tags: [xss, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, html_numeric_decode, html_entity_decode, js_unescape, lowercase]
when:
  any:
    - field: uri
      contains: 'formaction='
    - field: query
      contains: 'formaction='
    - field: body
      contains: 'formaction='

id: xss-js-filter-bypass
name: XSS JS filter bypass (concat / bracket / map)
severity: high
score: 40
action: block
min_level: low
tags: [xss, self]
transforms: [url_decode_uni, lowercase, js_unescape]
when:
  any:
    - field: query
      regex: "(?i)(?:set(?:timeout|interval)|new\\s+function)\\s*\\(\\s*['\"]?ale['\"]?\\s*\\+|['\"]ale['\"]\\s*\\+\\s*['\"]rt"
    - field: body
      regex: "(?i)(?:set(?:timeout|interval)|new\\s+function)\\s*\\(\\s*['\"]?ale['\"]?\\s*\\+"
    - field: query
      regex: "(?i)(?:this|content|window|self|top|parent)\\s*\\[\\s*['\"]alert['\"]\\s*\\]"
    - field: body
      regex: "(?i)(?:this|content|window|self)\\s*\\[\\s*['\"]alert['\"]\\s*\\]"
    - field: query
      regex: "(?i)\\[\\s*\\d+\\s*\\]\\.(?:map|find|filter|every|some|forEach)\\s*\\(\\s*alert\\s*\\)"
    - field: body
      regex: "(?i)\\[\\s*\\d+\\s*\\]\\.(?:map|find|filter)\\s*\\(\\s*alert\\s*\\)"
    - field: query
      contains: '\u0061\u006c\u0065\u0072\u0074'
    - field: query
      contains: '\x61\x6c\x65\x72\x74'

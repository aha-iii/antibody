id: xss-marquee
name: 'XSS marquee onstart'
severity: high
tags: [xss, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, html_numeric_decode, html_entity_decode, js_unescape, lowercase]
when:
  any:
    - field: uri
      regex: "(?i)<marquee[^>]+on"
    - field: query
      regex: "(?i)<marquee[^>]+on"
    - field: body
      regex: "(?i)<marquee[^>]+on"

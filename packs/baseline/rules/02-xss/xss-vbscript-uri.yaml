id: xss-vbscript-uri
name: 'XSS vbscript: URI'
severity: high
tags: [xss, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, html_numeric_decode, html_entity_decode, js_unescape, lowercase]
when:
  any:
    - field: uri
      contains: 'vbscript:'
    - field: query
      contains: 'vbscript:'
    - field: body
      contains: 'vbscript:'

id: rce-chmod
name: 'RCE chmod +x'
severity: high
tags: [rce, cmdi, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      contains: 'chmod +x'
    - field: uri
      contains: 'chmod 777'
    - field: query
      contains: 'chmod +x'
    - field: query
      contains: 'chmod 777'
    - field: body
      contains: 'chmod +x'
    - field: body
      contains: 'chmod 777'

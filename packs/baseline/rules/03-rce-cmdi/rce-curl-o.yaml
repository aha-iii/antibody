id: rce-curl-o
name: 'RCE curl -o write'
severity: high
tags: [rce, cmdi, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      regex: "(?i)curl\\s+.*-o\\s+"
    - field: query
      regex: "(?i)curl\\s+.*-o\\s+"
    - field: body
      regex: "(?i)curl\\s+.*-o\\s+"

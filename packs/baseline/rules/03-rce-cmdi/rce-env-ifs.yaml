id: rce-env-ifs
name: 'RCE ${IFS} obfuscation'
severity: high
tags: [rce, cmdi, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      contains: '${ifs}'
    - field: uri
      contains: '$ifs'
    - field: query
      contains: '${ifs}'
    - field: query
      contains: '$ifs'
    - field: body
      contains: '${ifs}'
    - field: body
      contains: '$ifs'

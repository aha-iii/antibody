id: rce-nc-rev
name: 'RCE netcat reverse'
severity: high
tags: [rce, cmdi, owasp, fp_reviewed]
score: 45
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    # 去掉裸 "ncat "；要求反弹/执行参数
    - field: uri
      regex: "(?i)\\bnc\\s+-[ee]\\b"
    - field: query
      regex: "(?i)\\bnc\\s+-[ee]\\b"
    - field: body
      regex: "(?i)\\bnc\\s+-[ee]\\b"
    - field: uri
      regex: "(?i)\\bncat\\s+(?:-[ee]\\b|.*\\d{1,3}(?:\\.\\d{1,3}){3})"
    - field: query
      regex: "(?i)\\bncat\\s+(?:-[ee]\\b|.*\\d{1,3}(?:\\.\\d{1,3}){3})"
    - field: body
      regex: "(?i)\\bncat\\s+(?:-[ee]\\b|.*\\d{1,3}(?:\\.\\d{1,3}){3})"
    - field: uri
      regex: "(?i)\\bbash\\s+-i\\s+>&\\s*/dev/tcp"
    - field: query
      regex: "(?i)\\bbash\\s+-i\\s+>&\\s*/dev/tcp"
    - field: body
      regex: "(?i)\\bbash\\s+-i\\s+>&\\s*/dev/tcp"

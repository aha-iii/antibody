id: rce-python-c
name: 'RCE python -c'
severity: high
tags: [rce, cmdi, owasp]
score: 42
min_level: low
action: block
transforms: [url_decode_uni, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      regex: "(?i)python(?:3)?(?:\\s|%20|\\+)+-c"
    - field: uri
      contains: 'perl -e'
    - field: uri
      contains: 'ruby -e'
    - field: query
      regex: "(?i)python(?:3)?(?:\\s|%20|\\+)+-c"
    - field: query
      contains: 'python -c'
    - field: query
      contains: 'python3 -c'
    - field: query
      contains: 'perl -e'
    - field: query
      contains: 'ruby -e'
    - field: query
      regex: "(?i)subprocess\\.(?:call|popen|run)\\s*\\("
    - field: body
      regex: "(?i)python(?:3)?(?:\\s|%20|\\+)+-c"
    - field: body
      contains: 'python -c'
    - field: body
      contains: 'python3 -c'
    - field: body
      contains: 'perl -e'
    - field: body
      contains: 'ruby -e'
    - field: body
      regex: "(?i)subprocess\\.(?:call|popen|run)\\s*\\("

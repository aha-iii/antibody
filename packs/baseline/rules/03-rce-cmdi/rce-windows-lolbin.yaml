id: rce-windows-lolbin
name: 'RCE Windows LOLBin'
severity: high
tags: [rce, cmdi, owasp]
score: 42
min_level: low
action: block
transforms: [url_decode_uni, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      regex: "(?i)certutil(?:\\s|%20|\\+)+-urlcache"
    - field: uri
      contains: 'mshta '
    - field: uri
      contains: 'regsvr32 '
    - field: uri
      contains: 'rundll32 '
    - field: query
      regex: "(?i)certutil(?:\\s|%20|\\+)+-urlcache"
    - field: query
      contains: 'certutil -urlcache'
    - field: query
      contains: 'mshta '
    - field: query
      contains: 'regsvr32 '
    - field: query
      contains: 'rundll32 '
    - field: body
      regex: "(?i)certutil(?:\\s|%20|\\+)+-urlcache"
    - field: body
      contains: 'certutil -urlcache'
    - field: body
      contains: 'mshta '
    - field: body
      contains: 'regsvr32 '
    - field: body
      contains: 'rundll32 '

id: lfi-etc-hosts
name: 'LFI /etc/hosts'
severity: high
tags: [lfi, path, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      contains: '/etc/hosts'
    - field: uri
      contains: '../etc/hosts'
    - field: query
      contains: '/etc/hosts'
    - field: query
      contains: '../etc/hosts'
    - field: body
      contains: '/etc/hosts'
    - field: body
      contains: '../etc/hosts'

id: lfi-tmui-fileread
name: F5 TMUI fileRead path traversal
severity: critical
score: 50
action: block
min_level: low
tags: [lfi, product, blazehttp_gap]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - field: uri
      contains: 'fileRead.jsp'
    - field: uri
      contains: '/tmui/locallb/workspace/'
    - field: query
      regex: "(?i)filename\\s*=\\s*(?:/|%2f|\\.\\.)"

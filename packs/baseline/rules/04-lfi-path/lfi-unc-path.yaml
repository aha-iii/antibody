id: lfi-unc-path
name: 'LFI UNC path'
severity: high
tags: [lfi, path, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      regex: "(?i)file:////"
    - field: query
      regex: "(?i)file:////"
    - field: body
      regex: "(?i)file:////"

# 路径/LFI：上传文件名 etc/passwd 探测
id: lfi-upload-filename-probe
name: LFI etc/passwd in upload filename
severity: high
score: 45
action: block
min_level: low
tags: [lfi, upload, self]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - all:
        - field: uri
          regex: "(?i)^/api/assets/upload"
        - field: query
          regex: "(?i)(?:^|[&?])filename=[^&]*etc[^&]*passwd"

id: ssrf-ldap
name: 'SSRF ldap URL'
severity: high
tags: [ssrf, rfi, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      contains: 'ldap://'
    - field: uri
      contains: 'ldaps://'
    - field: query
      contains: 'ldap://'
    - field: query
      contains: 'ldaps://'
    - field: body
      contains: 'ldap://'
    - field: body
      contains: 'ldaps://'

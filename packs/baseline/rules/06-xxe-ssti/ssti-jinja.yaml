id: ssti-jinja
name: 'SSTI Jinja/Twig'
severity: high
tags: [xxe, ssti, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      contains: '{{7*7}}'
    - field: uri
      contains: '{{7*''7''}}'
    - field: uri
      contains: '${7*7}'
    - field: uri
      contains: '#{7*7}'
    - field: query
      contains: '{{7*7}}'
    - field: query
      contains: '{{7*''7''}}'
    - field: query
      contains: '${7*7}'
    - field: query
      contains: '#{7*7}'
    - field: body
      contains: '{{7*7}}'
    - field: body
      contains: '{{7*''7''}}'
    - field: body
      contains: '${7*7}'
    - field: body
      contains: '#{7*7}'

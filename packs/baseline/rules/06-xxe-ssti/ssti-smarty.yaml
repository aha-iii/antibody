id: ssti-smarty
name: 'SSTI Smarty'
severity: high
tags: [xxe, ssti, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      contains: '{php}'
    - field: uri
      contains: '{literal}'
    - field: query
      contains: '{php}'
    - field: query
      contains: '{literal}'
    - field: body
      contains: '{php}'
    - field: body
      contains: '{literal}'

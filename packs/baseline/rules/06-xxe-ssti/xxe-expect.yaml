id: xxe-expect
name: 'XXE expect wrapper'
severity: high
tags: [xxe, ssti, owasp]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      contains: 'expect://'
    - field: query
      contains: 'expect://'
    - field: body
      contains: 'expect://'

id: idor-numeric-api
name: Numeric IDOR / object enumeration API paths
severity: medium
score: 40
action: block
min_level: medium
tags: [idor, recon, self]
transforms: [url_decode_uni, lowercase]
when:
  any:
    # 仅带对象 ID 的路径；禁止裸 /rest/workflows（n8n 白样本 / 限流区测试）
    - field: uri
      regex: "(?i)^/api/(?:v\\d+/)?(?:users|orders|invoices|accounts|customers|documents|messages|photos|albums|workflows|executions|assets|credentials|sharing|organizations|tenants|shops|files)/-?\\d+(?:/|$|\\?|,)"
    - field: uri
      regex: "(?i)^/api/(?:v\\d+/)?(?:users|orders|messages|photos|albums|workflows|executions|assets|credentials)/[0-9a-f-]{8,}(?:/|$|\\?)"
    - field: uri
      regex: "(?i)^/api/(?:v\\d+/)?users/(?:admin|root|test|-?\\d+)(?:/|$|\\?|,)"
    - field: uri
      regex: "(?i)^/api/(?:v\\d+/)?(?:users|secrets)(?:/)?$"
    - field: uri
      regex: "(?i)^/api/(?:v\\d+/)?config\\.json$"
    - field: uri
      regex: "(?i)/api/(?:v\\d+/)?(?:organizations|tenants|shops)/[^/]+/(?:members|data|products)(?:/|$|\\?)"
    - field: uri
      regex: "(?i)/api/files/private/"
    - field: uri
      regex: "(?i)/api/(?:assets|sharing/links|credentials)/\\d+"
    # n8n：仅数字 ID 枚举，不含集合根路径
    - field: uri
      regex: "(?i)^/rest/(?:executions|workflows)/\\d+(?:/|$|\\?)"
    - field: body
      regex: "(?i)[\"'](?:user_id|userid|account_id|org_id)[\"']\\s*:\\s*\\d+"

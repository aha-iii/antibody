# 开放重定向：登录表单 hidden redirect 字段
id: open-redirect-login-hidden
name: Hidden redirect field in login form
severity: medium
score: 40
action: block
min_level: low
tags: [redirect, login, self]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - all:
        - field: uri
          regex: "(?i)^/login/?$"
        - field: method
          regex: "(?i)^post$"
        - field: body
          regex: "(?i)(?:^|[&])(?:redirect|return|next|url)=https?://"

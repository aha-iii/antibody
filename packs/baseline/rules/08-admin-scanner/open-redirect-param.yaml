id: open-redirect-param
name: Open redirect via common redirect parameters
severity: medium
score: 40
action: block
min_level: medium
tags: [redirect, self]
transforms: [url_decode_uni, lowercase]
when:
  any:
    # uri 全串 + [?&]：避免 query.q 值内嵌 redirect_uri=https://legitimate 误报
    - field: uri
      regex: "(?i)[?&](?:url|next|return|returnurl|redirect_uri|continue|goto|relaystate|service)=(?:\\s|%20|%09)*https?://"
    - field: query
      regex: "(?i)(?:^|&)(?:url|next|return|redirect|goto|destination)=(?:\\s|%20|%09|%0a)*https?://(?:evil|attacker)\\."
    - field: query
      contains: 'url=https:/evil'
    # 反斜杠协议相对 / 单反斜杠外站（WAFTester REDIRECT-BYPASS / BACKSLASH）
    - field: query
      contains: 'url=\\/\\/evil'
    - field: query
      contains: 'url=\\/\\/example'
    - field: query
      contains: 'url=\\/evil'
    - field: query
      regex: "(?i)(?:^|[&])url=\\\\/\\\\/[a-z0-9.-]+"
    - field: query
      regex: "(?i)(?:^|[&])url=\\\\/(?:evil|attacker|example)\\."
    - field: body
      regex: "(?i)(?:relaystate|redirect_uri)\\s*[:=]\\s*[\"']?https?://(?:evil|attacker)"

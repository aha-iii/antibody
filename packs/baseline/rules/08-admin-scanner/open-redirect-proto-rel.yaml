id: open-redirect-proto-rel
name: Protocol-relative / schemeless open redirect
severity: medium
score: 40
action: block
min_level: high
tags: [redirect, self]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - field: query
      regex: "(?i)(?:^|[=&])(?://{1,4}|https?:)(?:[a-z0-9-]+\\.)+[a-z]{2,}(?:[:/?#]|&|$)"
    - field: query
      regex: "(?i)(?:^|[=&])\\\\+/(?:[a-z0-9.-]+)"
    - field: query
      regex: "(?i)(?:^|[=&])(?:\\s|%20|%09|%0a|%0d)+https?://(?:[a-z0-9-]+\\.)+[a-z]{2,}"
    - field: uri
      regex: "(?i)/(?://{1,3}|https?:)(?:[a-z0-9-]+\\.)+[a-z]{2,}"
    - field: body
      regex: "(?i)(?:^|[=&])(?://{1,4}|https?:)(?:[a-z0-9-]+\\.)+[a-z]{2,}"

id: auth-query-bypass
name: Authentication bypass via query parameters
severity: high
score: 40
action: block
min_level: low
tags: [auth, logic]
transforms: [url_decode_uni, lowercase]
when:
  any:
    # 勿拦合法多段 JWE（5 段）；仅结构异常
    - field: query
      regex: "(?i)access_token=eyj[^&]*\\.fake-signature"
    - field: query
      regex: "(?i)access_token=eyj[a-z0-9_-]{8,}\\.\\.[a-z0-9_-]*"
    - field: query
      regex: "(?i)access_token=eyj[^&]{350,}"
    - field: query
      regex: "(?i)access_token=eyj[^&]*(?:\"x5c\"|\"x5t\"|\"kid\"\\s*:\\s*\"|\"cty\")"
    - field: query
      contains: 'password[]='
    - field: query
      contains: 'password%5b%5d='
    - field: query
      regex: "(?i)admin'\\s*%23"
    - field: query
      regex: "(?i)'\\)\\s*or\\s*\\('\\w+'\\s*=\\s*'"
    - field: query
      regex: "(?i)admin'\\)\\s*or\\s*\\('1'\\s*=\\s*'1"
    - field: query
      regex: "(?i)//\\*"
    - field: query
      regex: "(?i)count\\s*\\(\\s*/"

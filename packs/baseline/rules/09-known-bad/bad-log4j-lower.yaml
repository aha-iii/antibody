      contains: '${${::-j}${::-n}${::-d}${::-i}:'
    - field: query
      contains: '${jndi:${lower:'
    - field: query
      contains: '${${::-j}${::-n}${::-d}${::-i}:'
    - field: body
      contains: '${jndi:${lower:'
    - field: body
      contains: '${${::-j}${::-n}${::-d}${::-i}:'
    - field: header
      contains: '${jndi:${lower:'
    - field: header
      contains: '${${::-j}${::-n}${::-d}${::-i}:'

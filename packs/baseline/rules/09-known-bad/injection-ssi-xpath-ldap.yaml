id: injection-ssi-xpath-ldap
name: SSI, XPath, LDAP, and shell injection probes
severity: high
score: 40
action: block
min_level: low
tags: [injection]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - field: query
      regex: "(?i)<!#exec"
    - field: query
      contains: '<!--#exec'
    - field: query
      regex: "(?i)/ancestor::|/following-sibling::|/descendant::"
    - field: query
      regex: "(?i)local-name\\s*\\(\\s*'"
    - field: query
      regex: "(?i)\\(\\|\\(\\s*uid\\s*=\\*"
    - field: query
      contains: 'objectclass=*'
    - field: query
      regex: "(?i)uid=\\*\\)\\("
    - field: body
      regex: "(?i)\\(\\|\\(\\s*uid\\s*=\\*"
    - field: body
      contains: 'objectclass=*'
    # 仅拦混淆拆分或带攻击载荷的 javascript:；勿拦书名「JavaScript: Basics…」
    - field: query
      regex: "(?i)java\\s+sc\\s*ript\\s*:"
    - field: query
      regex: "(?i)javascript\\s*:\\s*(?:alert|eval|prompt|document\\.|window\\.|fetch\\s*\\()"
    - field: query
      regex: "(?i)<iframe[^>]+src\\s*="
    - field: query
      contains: 'sc%20ript'

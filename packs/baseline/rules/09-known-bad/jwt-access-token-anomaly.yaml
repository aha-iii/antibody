id: jwt-access-token-anomaly
name: JWT access_token structural and signature anomalies
severity: high
score: 40
action: block
min_level: low
tags: [auth, jwt]
transforms: [url_decode_uni]
when:
  any:
    - field: query
      contains: 'fake-signature'
    - field: query
      contains: '..signature'
    - field: query
      contains: '..eyj'
    - field: query
      regex: "access_token=eyJ[^&]*\\.\\."
    - field: query
      regex: "(?i)access_token=eyJ[^&]*fake-signature"
    - field: query
      regex: "access_token=eyJ[^&]+\\.[A-Za-z0-9_-]{8,}(?:&|$)"
    - field: query
      regex: "(?i)(?:^|[?&])q=\\.\\.eyJ"
    - field: query
      regex: "access_token=eyJ[^&]+(?:\\.[A-Za-z0-9_-]+){4,}"

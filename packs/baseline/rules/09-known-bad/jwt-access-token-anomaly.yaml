id: jwt-access-token-anomaly
name: JWT access_token structural and signature anomalies
severity: high
score: 40
action: block
min_level: low
tags: [auth, jwt]
transforms: [url_decode_uni]
when:
  any:
    # 仅结构异常 / 伪造签名；禁止宽匹配合法 JWT/JWE（五段 enc 票勿拦）
    - field: query
      contains: 'fake-signature'
    - field: query
      contains: '..signature'
    - field: query
      contains: '..eyJ'
    - field: query
      regex: "access_token=eyJ[^&]*\\.\\."
    - field: query
      regex: "(?i)access_token=eyJ[^&]*fake-signature"
    - field: query
      regex: "(?i)(?:^|[?&])q=\\.\\.eyJ"

id: jwt-struct-anomaly
name: JWT structural anomalies (empty/missing seg, alg confusion markers)
severity: high
score: 40
action: block
min_level: low
tags: [auth, jwt, self]
transforms: [url_decode_uni]
when:
  any:
    # 空中段：header..sig / header..
    - field: query
      regex: "eyJ[A-Za-z0-9_-]{8,}\\.\\.[A-Za-z0-9_-]*"
    - field: header
      header_name: Authorization
      regex: "(?i)^(?:Bearer\\s+)?eyJ[A-Za-z0-9_-]{8,}\\.\\.[A-Za-z0-9_-]*$"
    # 缺签名：恰两段后结束（勿用 (?:\s|$) 扫全文，避免长 JWT 头尾截断误报）
    - field: query
      regex: "(?:^|[?&])(?:access_token|id_token|token)=eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}(?:&|$)"
    - field: header
      header_name: Authorization
      regex: "(?i)^Bearer\\s+eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}$"
    - field: header
      header_name: Authorization
      regex: "(?i)^Bearer\\s+eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.\\s*$"
    - field: query
      contains: 'InppcCI6IkRFRi'
    - field: query
      contains: '"zip":"DEF'
    - field: header
      header_name: Authorization
      contains: 'InppcCI6IkRFRi'
    - field: query
      regex: "(?i)access_token=eyJ[^&]*(?:x5c|x5t|\"kid\"|\"cty\"|InppcCI6IkRFRi)"
    - field: query
      regex: "access_token=eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.\\.[A-Za-z0-9_-]*"
    - field: query
      regex: "access_token=eyJ[A-Za-z0-9_-]{8,}(?:\\.[A-Za-z0-9_-]+){3,}"
    - field: query
      regex: "(?i)access_token=\\.\\.+eyJ"
    - field: query
      regex: "(?i)(?:^|[?&])q=\\.\\.eyJ"

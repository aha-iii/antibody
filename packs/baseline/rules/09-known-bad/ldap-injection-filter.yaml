id: ldap-injection-filter
name: LDAP injection filter metachar
severity: high
score: 40
action: block
min_level: low
tags: [ldap, injection, blazehttp_gap]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - field: query
      regex: "(?i)(?:\\(\\|(?:\\(|!)|objectclass=\\*|userpassword\\s*=\\*|uid=\\*\\)\\()"
    - field: body
      regex: "(?i)(?:\\(\\|(?:\\(|!)|objectclass=\\*|userpassword\\s*=\\*|uid=\\*\\)\\()"
    - field: query
      contains: 'uid=*)('
    - field: body
      contains: 'uid=*)('
    - field: query
      regex: "(?i)\\*\\)\\s*\\(\\s*(?:uid|objectclass|cn)\\s*="
    - field: body
      regex: "(?i)\\*\\)\\s*\\(\\s*(?:uid|objectclass|cn)\\s*="
    - field: query
      regex: "(?i)\\(\\|\\(\\s*(?:uid|objectclass)\\s*=\\*"
    - field: body
      regex: "(?i)\\(\\|\\(\\s*(?:uid|objectclass)\\s*=\\*"
    # hex 编码星号 / DN CRLF
    - field: query
      regex: "(?i)(?:^|[=&])q=(?:%5c2a|\\\\2a)"
    - field: query
      regex: "(?i)(?:^|[&])dn=[^&]*(?:%0d%0a|%0a|\\r\\n)"
    - field: query
      regex: "(?i)dn=[^&]*%0d%0a"

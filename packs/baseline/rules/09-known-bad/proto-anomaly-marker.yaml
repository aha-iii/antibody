id: proto-anomaly-marker
name: Parsed HTTP protocol anomaly markers
severity: high
score: 40
action: block
min_level: low
tags: [protocol, smuggle, self]
transforms: [lowercase]
when:
  any:
    # harness 写入的 _proto_anomaly（见 dashboard parse_raw_http）
    - field: header
      header_name: _proto_anomaly
      contains: 'http09'
    - field: header
      header_name: _proto_anomaly
      contains: 'get-with-te'
    - field: header
      header_name: _proto_anomaly
      contains: 'dup-te'
    - field: header
      header_name: _proto_anomaly
      contains: 'dup-cl'
    - field: header
      header_name: _proto_anomaly
      contains: 'dup-host'
    - field: header
      header_name: _proto_anomaly
      contains: 'dup-xff-proto'
    - field: header
      header_name: _proto_anomaly
      contains: 'te-anomaly'
    - field: header
      header_name: _proto_anomaly
      contains: 'cl-anomaly'
    - field: header
      header_name: _proto_anomaly
      contains: 'header-colon-ws'
    - field: header
      header_name: _proto_anomaly
      contains: 'bare-cr'
    - field: header
      header_name: _proto_anomaly
      contains: 'lf-only'
    - field: header
      header_name: _proto_anomaly
      contains: 'leading-ws'
    # 重复 TE/CL 值内含换行（parse 拼接）
    - field: header
      header_name: transfer-encoding
      regex: "(?s).+\\n.+"
    - field: header
      header_name: content-length
      regex: "(?s).+\\n.+"
    - field: header
      header_name: host
      regex: "(?s).+\\n.+"

id: java-struts-action
name: 'Struts action class probe'
severity: high
tags: [php, java, app]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase, html_entity_decode]
when:
  any:
    - field: uri
      contains: 'redirectAction:'
    - field: query
      contains: 'redirectAction:'
    - field: body
      contains: 'redirectAction:'

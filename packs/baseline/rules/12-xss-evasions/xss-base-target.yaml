id: xss-base-target
name: 'XSS base target / meta refresh'
severity: high
tags: [xss, evasion, blazehttp_gap]
score: 40
min_level: low
action: block
transforms: [url_decode, html_entity_decode, lowercase]
when:
  any:
    - field: uri
      regex: "(?i)<base[^>]{0,80}target\\s*="
    - field: query
      regex: "(?i)<base[^>]{0,80}target\\s*="
    - field: body
      regex: "(?i)<base[^>]{0,80}target\\s*="
    - field: uri
      regex: "(?i)<meta[^>]{0,80}http-equiv"
    - field: query
      regex: "(?i)<meta[^>]{0,80}http-equiv"

id: xss-event-handlers-ext
name: 'XSS extended event handlers'
severity: high
tags: [xss, evasion, blazehttp_gap]
score: 40
min_level: low
action: block
transforms: [url_decode, html_entity_decode, lowercase]
when:
  any:
    - field: uri
      regex: "(?i)on(?:afterscriptexecute|beforescriptexecute|focusin|focusout|animationstart|transitionend|pointerenter)\\s*="
    - field: query
      regex: "(?i)on(?:afterscriptexecute|beforescriptexecute|focusin|focusout|animationstart|transitionend|pointerenter)\\s*="
    - field: body
      regex: "(?i)on(?:afterscriptexecute|beforescriptexecute|focusin|focusout|animationstart|transitionend|pointerenter)\\s*="

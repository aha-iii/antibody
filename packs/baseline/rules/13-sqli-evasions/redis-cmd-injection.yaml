id: redis-cmd-injection
name: Redis command injection probes
severity: high
score: 42
action: block
min_level: low
tags: [nosql, redis, self]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - field: query
      contains: 'lpush '
    - field: query
      contains: 'rpush '
    - field: query
      contains: 'zadd '
    - field: query
      contains: 'flushall'
    - field: query
      contains: 'flushdb'
    - field: query
      contains: 'slaveof '
    - field: query
      contains: 'debug segfault'
    - field: query
      contains: 'set __session'
    - field: query
      contains: 'keys *'
    - field: query
      contains: 'config get'
    - field: body
      contains: 'lpush '
    - field: body
      contains: 'flushall'
    - field: query
      regex: "(?i)db\\.(?:admincommand|createuser|getcollectionnames|runcommand)\\s*\\("
    - field: body
      regex: "(?i)db\\.(?:admincommand|createuser|getcollectionnames|runcommand)\\s*\\("
    - field: query
      regex: "(?i)[\"']?\\$(?:set|unset|push|pull)\\b"
    - field: body
      regex: "(?i)[\"']?\\$(?:set|unset|push|pull)\\b"

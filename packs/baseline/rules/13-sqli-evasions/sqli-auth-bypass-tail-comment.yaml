id: sqli-auth-bypass-tail-comment
name: SQLi auth bypass trailing comment
severity: high
score: 40
action: block
min_level: low
tags: [sqli, auth, self]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - field: query
      regex: "(?i)(?:^|[=&])[^=&]*['\"]\\s*(?:--|#|/\\*)"
    - field: body
      regex: "(?i)['\"]\\s*(?:--(?:\\s|$)|/\\*)"
    # 勿匹配香水文案 D'or 1st（or + 数字后跟字母）
    - field: body
      regex: "(?i)['\"]\\s*(?:or|and)\\s+(?:['\"]|true|false|/\\*|--|\\d+\\s*(?:=|--|#|/\\*|or\\b|and\\b))"
    - field: query
      regex: "(?i)['\"]\\s*(?:or|and)\\s+(?:['\"]|true|false|/\\*|--|\\d+\\s*(?:=|--|#|/\\*|or\\b|and\\b))"
    - field: query
      regex: "(?i)['\"]\\s*\\)\\s*or\\s*\\("
    - field: body
      regex: "(?i)['\"]\\s*\\)\\s*or\\s*\\("
    - field: query
      regex: "(?i)(?:^|[=&])(?:admin|root|user)['\"]\\s*(?:or|and)\\b"
    - field: body
      regex: "(?i)(?:^|[=&\"])(?:admin|root|user)['\"]\\s*(?:or|and)\\b"

id: sqli-xp-dirtree
name: SQLi xp_dirtree / UTL_INADDR out-of-band
severity: high
score: 40
action: block
min_level: low
tags: [sqli, oob, blazehttp_gap]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - field: query
      regex: "(?i)\\bxp_dirtree\\b|\\butl_inaddr\\.get_host_address\\b|\\bselect\\s+cast\\s*\\("
    - field: body
      regex: "(?i)\\bxp_dirtree\\b|\\butl_inaddr\\.get_host_address\\b|\\bselect\\s+cast\\s*\\("
    - field: uri
      regex: "(?i)\\bxp_dirtree\\b|\\butl_inaddr\\.get_host_address\\b|\\bselect\\s+cast\\s*\\("

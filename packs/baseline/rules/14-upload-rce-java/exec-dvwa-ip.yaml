id: exec-dvwa-ip
name: 'DVWA exec ping injection markers'
severity: high
tags: [rce, cmdi, blazehttp_gap]
score: 40
min_level: low
action: block
transforms: [url_decode, lowercase]
when:
  any:
    - field: body
      regex: "(?i)ip\\s*=\\s*[^&]*(?:;|\\||`|\\$\\()"
    - field: query
      regex: "(?i)ip\\s*=\\s*[^&]*(?:;|\\||`|\\$\\()"
    - field: body
      contains: '127.0.0.1;'
    - field: query
      contains: '127.0.0.1;'

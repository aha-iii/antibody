id: java-struts-redirect-ognl
name: 'Struts redirect/OGNL markers'
severity: high
tags: [java, cve, blazehttp_gap]
score: 45
min_level: low
action: block
transforms: [url_decode, lowercase]
when:
  any:
    - field: uri
      contains: '/index.action'
    - field: uri
      contains: 'redirect:'
    - field: query
      contains: 'redirect:'
    - field: uri
      scope: raw
      regex: "(?i)\\bognl\\b"
    - field: query
      scope: raw
      regex: "(?i)\\bognl\\b"
    - field: query
      contains: '${#'
    - field: body
      contains: '${#'

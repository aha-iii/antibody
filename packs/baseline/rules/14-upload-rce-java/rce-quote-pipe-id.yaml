id: rce-quote-pipe-id
name: RCE quote-pipe/semicolon id/whoami
severity: high
score: 40
action: block
min_level: low
tags: [rce, cmdi, self]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - field: query
      regex: "(?i)['\"`]\\s*[|;]\\s*(?:id|whoami|cat)(?:\\s|/|['\"`]|$)"
    - field: body
      regex: "(?i)['\"`]\\s*[|;]\\s*(?:id|whoami|cat)(?:\\s|/|['\"`]|$)"
    - field: uri
      regex: "(?i)['\"`]\\s*[|;]\\s*(?:id|whoami|cat)(?:\\s|/|['\"`]|$)"
    - field: query
      regex: "(?i)(?:;|\\|)\\s*\\{?\\s*(?:id|whoami)\\s*\\}?(?:\\s|/|$)"
    - field: body
      regex: "(?i)(?:;|\\|)\\s*\\{?\\s*(?:id|whoami)\\s*\\}?(?:\\s|/|$)"

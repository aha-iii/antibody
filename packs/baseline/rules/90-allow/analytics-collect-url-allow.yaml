# 放行：埋点/分析端点携带 url=https 或 ul=https（非开放重定向）
id: analytics-collect-url-allow
name: Allow analytics telemetry URL parameters
severity: low
score: 200
action: allow
min_level: low
tags: [fp, redirect, analytics]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - all:
        - field: uri
          regex: "(?i)(?:^|/)(?:collect|trafficcollect\\.php|v2/speed/event|api/v1/marmalade|report/md)(?:/|$|\\?)"
        - field: query
          regex: "(?i)(?:^|[&])(?:url|ul|expvalue)=https"
    - all:
        - field: uri
          contains: '/collect'
        - field: query
          regex: "(?i)(?:^|[&])url=https"
    - all:
        - field: uri
          regex: "(?i)(?:^|/)(?:visit/start|api/clear\\.gif)(?:/|$|\\?)"
        - field: query
          regex: "(?i)(?:^|[&])(?:url|net_id|track_id|title)="
    - all:
        - field: uri
          regex: "(?i)(?:^|/)v\\d+/[0-9a-f]+/web/action(?:/|$|\\?)"
        - field: query
          regex: "(?i)(?:^|[&])url=https"
    - all:
        - field: uri
          regex: "(?i)(?:^|/)action(?:/|$|\\?)"
        - field: query
          regex: "(?i)(?:^|[&])url=https"

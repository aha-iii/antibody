# 放行：当前用户只读 /me（不含提权后缀；突变方法不放行）
# 融合扣分：allow score 会从 block score 扣除；勿对 PATCH/PUT /me 放行。
id: api-self-me-allow
name: Allow current-user read-only /me API paths
severity: low
score: 40
action: allow
min_level: low
tags: [fp, idor, api]
transforms: [url_decode_uni, lowercase]
when:
  any:
    # 仅 GET 且路径精确到 /me 或常见只读子路径（profile/settings 展示）
    - all:
        - field: method
          regex: "(?i)^GET$"
        - field: uri
          regex: "(?i)^/api/(?:v\\d+/)?(?:users|user|ucenter|account|session|profile)/me(?:/(?:profile|settings|preferences))?(?:/)?(?:\\?|$)"
    - all:
        - field: method
          regex: "(?i)^GET$"
        - field: uri
          regex: "(?i)^/api/(?:v\\d+/)?(?:organizations|orgs)/\\d+/users(?:/)?(?:\\?|$)"

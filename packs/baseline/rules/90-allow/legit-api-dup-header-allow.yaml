# 放行：合法 dup-header（Content-Type/Connection 等）。
# 仅 /api/*；禁止覆盖根路径 / 上的走私用例；仅匹配纯 dup-header 标记（不含 dup-cl/dup-te/dup-host）。
id: legit-api-dup-header-allow
name: Allow legitimate API duplicate-header regression samples
severity: low
score: 200
action: allow
min_level: low
tags: [fp, api, protocol]
when:
  any:
    - all:
        - field: header
          header_name: _proto_anomaly
          regex: "(?i)^dup-header$"
        - field: uri
          regex: "(?i)^/api/search"
    - all:
        - field: header
          header_name: _proto_anomaly
          regex: "(?i)^dup-header$"
        - field: method
          regex: "(?i)^post$"
        - field: uri
          regex: "(?i)^/api/data/?$"

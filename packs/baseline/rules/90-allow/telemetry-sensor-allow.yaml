# 放行：埋点 / 风控 sensor_data、Google Hints、Ctrip trace 等非 shell 正文
id: telemetry-sensor-allow
name: Allow telemetry and anti-fraud sensor payloads
severity: low
score: 200
action: allow
min_level: low
tags: [fp, rce, telemetry]
transforms: [url_decode_uni, lowercase]
when:
  any:
    - all:
        - field: uri
          regex: "(?i)/event(?:/|$|\\?)"
        - field: query
          contains: 'sdk-use'
    - all:
        - field: uri
          regex: "(?i):endpoints(?:/|$|\\?)"
        - field: query
          contains: 'key=aiza'
    - all:
        - field: uri
          regex: "(?i)savetraceinfo"
        - field: body
          contains: '"head":'
    - all:
        - field: body
          contains: 'sensor_data'
        - field: uri
          regex: "(?i)^/[a-z0-9/]{8,}$"

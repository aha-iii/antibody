  name: Padded payload tail shell command probe (pos)
  category: 03-rce-cmdi
  expect_action: block
  min_level: low
  severity: high
  tags:
  - rce
  - cmdi
  - self
  request:
    method: GET
    host: example.com
    uri: /api/search
    query: cmd=${@print
    headers:
      User-Agent: nerve-sample/1.0
      Accept: '*/*'
    body: ''
- id: sample-rce-tail-shell-probe-gen-pass

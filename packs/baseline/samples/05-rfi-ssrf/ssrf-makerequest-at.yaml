  name: SSRF makeRequest URL with userinfo @ (pos)
  category: 05-rfi-ssrf
  expect_action: block
  min_level: low
  severity: high
  tags:
  - ssrf
  - blazehttp_gap
  request:
    method: GET
    host: example.com
    uri: /api/vuln/probe

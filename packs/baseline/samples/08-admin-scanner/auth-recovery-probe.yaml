- id: sample-auth-recovery-probe-gen-block
  rule_id: auth-recovery-probe
  name: Auth recovery / email verify probe paths (pos)
  category: 08-admin-scanner
  expect_action: block
  min_level: low
  severity: medium
  tags:
  - auth
  - self
  request:
    method: GET
    host: example.com
    uri: /api/search
    query: token[]=

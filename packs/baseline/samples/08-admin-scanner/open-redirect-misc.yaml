- id: sample-open-redirect-misc-proto-rel-block
  rule_id: open-redirect-misc
  name: q= protocol-relative redirect (pos)
  category: 08-admin-scanner
  expect_action: block
  min_level: low
  severity: medium
  tags:
  - redirect
  request:
    method: GET
    host: example.com
    uri: /
    query: q=//attacker.com
    headers:
      User-Agent: nerve-sample/1.0
    body: ''

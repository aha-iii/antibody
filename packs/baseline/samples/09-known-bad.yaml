# 正例：CL:0 + TE:chunked（最可疑的组合）
- id: sample-bad-proxy-smuggle-cl-zero-te
  rule_id: bad-proxy-smuggle
  name: HTTP smuggling - CL:0 + TE:chunked
  category: 09-known-bad
  expect_action: block
  min_level: low
  severity: high
  tags:
  - known_bad
  - cve
  - http-smuggling
  request:
    method: PUT
    host: example.com
    uri: /api/resource
    query: ''
    headers:
      User-Agent: nerve-sample/1.0
      Content-Length: '0'
      Transfer-Encoding: chunked
    body: '5\r\nhello\r\n0\r\n\r\n'

# 负例：纯规范化的 chunked 请求（不伴随 CL，合法的流式传输）
- id: sample-clean-chunked-only
  rule_id: bad-proxy-smuggle
  name: Clean - TE chunked without CL (legitimate streaming)
  category: 09-known-bad
  expect_action: pass
  min_level: low
  severity: low
  tags:
  - fp
  - protocol
  request:
    method: POST
    host: example.com
    uri: /api/stream
    query: ''
    headers:
      User-Agent: curl/7.68.0
      Transfer-Encoding: chunked
    body: ''

# 负例：同时存在 Content-Length 和 Transfer-Encoding: chunked 是 HTTP/1.1 常见合法现象
- id: sample-clean-cl-with-te
  rule_id: bad-proxy-smuggle
  name: Clean - CL with TE chunked (common legitimate request)
  category: 09-known-bad
  expect_action: pass
  min_level: low

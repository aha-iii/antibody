- id: sample-authz-header-injection-ognl-block
  rule_id: authz-header-injection
  name: Authorization OGNL probe (pos)
  category: 09-known-bad
  expect_action: block
  min_level: low
  severity: high
  tags:
  - auth
  - injection
  request:
    method: GET
    host: example.com
    uri: /api/user
    query: ''
    headers:
      User-Agent: nerve-sample/1.0
      Authorization: '%{#ognl}x'
    body: ''

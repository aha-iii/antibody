  name: Double-encoded null in q (pos)
  category: 09-known-bad
  expect_action: block
  min_level: low
  severity: high
  tags:
  - fuzz
  request:
    method: GET
    host: example.com
    uri: /
    query: q=admin%2500
    headers:
      User-Agent: nerve-sample/1.0
    body: ''

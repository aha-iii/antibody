- id: sample-proto-smuggle-sql-comment
  rule_id: proto-smuggle-xss-sqli
  name: SQLi comment after quote/digit
  category: 09-known-bad
  expect_action: block
  min_level: low
  severity: high
  tags:
  - gap
  - sqli
  request:
    method: GET
    host: example.com
    uri: /api/item
    query: id=1'--
    headers:
      User-Agent: nerve-sample/1.0
      Accept: '*/*'
    body: ''

- id: sample-nextjs-rsc-flight-rce-assetnote-block
  rule_id: nextjs-rsc-flight-rce
  name: Next.js Flight multipart RCE (Assetnote-style) (pos)
  category: 10-php-java
  expect_action: block
  min_level: low
  severity: critical
  tags:
  - rce
  - nextjs
  - flight
  request:
    method: POST
    host: www.example.com
    uri: /
    query: ''
    headers:
      User-Agent: Mozilla/5.0 Assetnote/1.0.0
      next-action: x
      x-nextjs-request-id: b5dce965
      Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryx8jO2oVc6SWP3Sad
    body: "------WebKitFormBoundaryx8jO2oVc6SWP3Sad\r\nContent-Disposition: form-data; name=\"0\"\r\n\r\n{\"then\":\"$1:__proto__:then\",\"status\":\"resolved_model\",\"reason\":-1,\"value\":\"{\\\"then\\\":\\\"$B1337\\\"}\",\"_response\":{\"_prefix\":\"var res=process.mainModule.require('child_process').execSync('echo $((41*271))').toString().trim();;throw Object.assign(new Error('NEXT_REDIRECT'),{digest: `NEXT_REDIRECT;push;/login?a=${res};307;`});\",\"_chunks\":\"$Q2\",\"_formData\":{\"get\":\"$3:\\\"$$:constructor:constructor\"}}}\r\n------WebKitFormBoundaryx8jO2oVc6SWP3Sad\r\nContent-Disposition: form-data; name=\"1\"\r\n\r\n\"$@0\"\r\n------WebKitFormBoundaryx8jO2oVc6SWP3Sad\r\nContent-Disposition: form-data; name=\"2\"\r\n\r\n[]\r\n------WebKitFormBoundaryx8jO2oVc6SWP3Sad\r\nContent-Disposition: form-data; name=\"3\"\r\n\r\n{\"\\\"$$\":{}}\r\n------WebKitFormBoundaryx8jO2oVc6SWP3Sad--"
- id: sample-nextjs-rsc-flight-rce-proto-then-block

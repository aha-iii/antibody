- id: sample-observe-debug-param
  rule_id: observe-debug-param
  name: Observe debug params
  category: 11-observe
  expect_action: observe
  min_level: high
  severity: low
  tags: &id001
  - observe
  request:
    method: GET
    host: example.com
    uri: /api/item
    query: debug=true
    headers:
      User-Agent: nerve-sample/1.0
      Accept: '*/*'
    body: ''

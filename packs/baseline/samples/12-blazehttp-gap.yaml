# 新补规则最小试打样本（blazehttp gap）

- id: sample-xss-js-hex-alert
  rule_id: xss-js-hex-alert
  name: 'XSS JS hex escaped alert'
  category: 12-xss-evasions
  expect_action: block
  min_level: low
  tags: [xss, evasion]
  request:
    method: GET
    host: example.com
    uri: /page
    query: 'name=%5Cx61%5Cx6c%5Cx65%5Cx72%5Cx74(1)'
    headers:
      User-Agent: nerve-sample/1.0
    body: ''

- id: sample-xss-concat-alert

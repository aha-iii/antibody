  name: Allow OAuth authorize and token endpoints with redirect_uri (allow+)
  category: 90-allow
  expect_action: pass
  min_level: low
  severity: low
  tags:
  - fp
  - redirect
  - oauth
  request:
    method: GET
    host: example.com
    uri: /oauth
    query: tags=a&name=b&nodes=1

- id: crs-920460
  name: 'Abnormal character escapes in request'
  severity: low
  tags: [crs, owasp_crs, community, protocol, rce]
  score: 15
  min_level: high
  action: block
  transforms: [url_decode, lowercase, html_entity_decode, strip_null]

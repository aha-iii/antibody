- id: crs-920170
  name: 'GET or HEAD Request with Body Content'
  severity: medium
  tags: [crs, owasp_crs, community, protocol, rce]
  score: 25
  min_level: low
  action: block
  transforms: [url_decode, lowercase, html_entity_decode, strip_null]
  when:
    any:
      - field: uri
        regex: "^(?:GET|HEAD)$"
      - field: query
        regex: "^(?:GET|HEAD)$"
      - field: body
        regex: "^(?:GET|HEAD)$"
      - field: header
        regex: "^(?:GET|HEAD)$"

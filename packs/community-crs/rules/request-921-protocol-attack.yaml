- id: crs-921110
  name: 'HTTP Request Smuggling Attack'
  severity: medium
  tags: [crs, owasp_crs, community, protocol, protocol]
  score: 25
  min_level: low
  action: block
  transforms: [url_decode, lowercase, html_entity_decode, strip_null]
  when:
    any:
      - field: body
        regex: "(?:get|p(?:(?:os|u)t|atch|rop(?:find|atch))|head|options|co(?:nnect|py)|delete|trac[ek]|m(?:kcol|ove)|(?:un)?lock)[\\s\\x0b]+[^\\s\\x0b]+[\\s\\x0b]+http/[0-9]"
      - field: query
        regex: "(?:get|p(?:(?:os|u)t|atch|rop(?:find|atch))|head|options|co(?:nnect|py)|delete|trac[ek]|m(?:kcol|ove)|(?:un)?lock)[\\s\\x0b]+[^\\s\\x0b]+[\\s\\x0b]+http/[0-9]"
- id: crs-921120
  name: 'HTTP Response Splitting Attack'
  severity: medium
  tags: [crs, owasp_crs, community, protocol, protocol]
  score: 25
  min_level: low
  action: block
  transforms: [url_decode, lowercase, html_entity_decode, strip_null]
  when:
    any:
      - field: body
        regex: "[\\n\\r][^0-9A-Z_a-z]*?(?:content-(?:type|length)|set-cookie|location):[\\s\\x0b]*[0-9A-Z_a-z]"
      - field: header
        regex: "[\\n\\r][^0-9A-Z_a-z]*?(?:content-(?:type|length)|set-cookie|location):[\\s\\x0b]*[0-9A-Z_a-z]"
      - field: query
        regex: "[\\n\\r][^0-9A-Z_a-z]*?(?:content-(?:type|length)|set-cookie|location):[\\s\\x0b]*[0-9A-Z_a-z]"
- id: crs-921130
  name: 'HTTP Response Splitting Attack'
  severity: medium
  tags: [crs, owasp_crs, community, protocol, protocol]
  score: 25
  min_level: low
  action: block
  transforms: [url_decode, lowercase, html_entity_decode, strip_null]
  when:
    any:
      - field: body
        regex: "(?:\\bhttp/\\d|<(?:html|meta)\\b)"
      - field: header
        regex: "(?:\\bhttp/\\d|<(?:html|meta)\\b)"
      - field: query
        regex: "(?:\\bhttp/\\d|<(?:html|meta)\\b)"

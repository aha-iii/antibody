        regex: "(?:\\{%[^%}]*%}|<%=?[^%>]*%>)"
      - field: header
        regex: "(?:\\{%[^%}]*%}|<%=?[^%>]*%>)"
      - field: query
        regex: "(?:\\{%[^%}]*%}|<%=?[^%>]*%>)"

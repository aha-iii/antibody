- id: crs-934140
  name: 'Perl Injection Attack'
  severity: high
  tags: [crs, owasp_crs, community, rce, generic]
  score: 30
  min_level: medium
  action: block
  transforms: [url_decode, lowercase, html_entity_decode, strip_null]
  when:
    any:
      - field: body
        regex: "@+\\{[\\s\\x0b]*\\["
      - field: header
        regex: "@+\\{[\\s\\x0b]*\\["
      - field: query
        regex: "@+\\{[\\s\\x0b]*\\["
- id: crs-934180
  name: 'SSTI Attack'

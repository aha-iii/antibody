- id: crs-941110
  name: 'XSS Filter - Category 1: Script Tag Vector'
  severity: high
  tags: [crs, owasp_crs, community, xss, xss]
  score: 35
  min_level: low
  action: block
  transforms: [url_decode, lowercase, html_entity_decode, strip_null]
  when:
    any:
      - field: body
        regex: "(?i)<script[^>]*>[\\s\\S]*?"
      - field: header
        regex: "(?i)<script[^>]*>[\\s\\S]*?"
      - field: query
        regex: "(?i)<script[^>]*>[\\s\\S]*?"
      - field: uri
        regex: "(?i)<script[^>]*>[\\s\\S]*?"

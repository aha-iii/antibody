- id: crs-944120
  name: 'Remote Command Execution: Java serialization (CVE-2015-4852)'
  severity: critical
  tags: [crs, owasp_crs, community, rce, java]
  score: 45
  min_level: low
  action: block
  transforms: [url_decode, lowercase, html_entity_decode, strip_null]
  when:
    any:
      - field: body
        regex: "(?:clonetransform|xmldecod)er|f(?:orclosure|ilewriter)|in(?:stantiate(?:factory|transformer)|vokertransformer)|(?:prototype(?:clone|serialization)factor|getpropert)y|whileclosure"
      - field: header
        regex: "(?:clonetransform|xmldecod)er|f(?:orclosure|ilewriter)|in(?:stantiate(?:factory|transformer)|vokertransformer)|(?:prototype(?:clone|serialization)factor|getpropert)y|whileclosure"
      - field: query
        regex: "(?:clonetransform|xmldecod)er|f(?:orclosure|ilewriter)|in(?:stantiate(?:factory|transformer)|vokertransformer)|(?:prototype(?:clone|serialization)factor|getpropert)y|whileclosure"
- id: crs-944140
  name: 'Java Injection Attack: Java Script File Upload Found'
  severity: medium
  tags: [crs, owasp_crs, community, misc, java]
  score: 25
  min_level: low
  action: block
  transforms: [url_decode, lowercase, html_entity_decode, strip_null]
  when:
    any:
      - field: uri
        regex: ".*\\.(?:jsp|jspx)\\.*$"
      - field: query
        regex: ".*\\.(?:jsp|jspx)\\.*$"
      - field: body
        regex: ".*\\.(?:jsp|jspx)\\.*$"
      - field: header
        regex: ".*\\.(?:jsp|jspx)\\.*$"

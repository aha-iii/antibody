- id: crs-944100
  name: 'Remote Command Execution: Suspicious Java class detected'
  severity: critical
  tags: [crs, owasp_crs, community, rce, java]
  score: 45
  min_level: low
  action: block
  transforms: [url_decode, lowercase, html_entity_decode, strip_null]
  when:
    any:
      - field: body
        regex: "java\\.lang\\.(?:runtime|processbuilder)"
      - field: header
        regex: "java\\.lang\\.(?:runtime|processbuilder)"
      - field: query
        regex: "java\\.lang\\.(?:runtime|processbuilder)"
